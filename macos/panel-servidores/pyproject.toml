[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panel-servidores"
version = "1.0.0"
description = "Panel de Servidores: administración gráfica de servidores TeleMet / Apache por SSH (macOS, PySide6)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rafa", email = "r.puerto@umh.es" }]
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
llavero = ["keyring>=24", "certifi"]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
panel-servidores = "panel_servidores.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panel_servidores = ["recursos/*", "icono.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
