<style>
/* ---- Colores: paleta de series validada (claro/oscuro) y superficies estilo iPadOS ---- */
:root {
  color-scheme: light dark;
  --page:#f2f2f0; --surface:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e6e5df; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --accent:#2a78d6; --on-accent:#fff;
  --good:#0ca30c; --critical:#d03b3b; --warn-bg:#fff4d6; --bar:rgba(249,249,247,.82); --segsel:#fff;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --series-5:#e87ba4; --series-6:#008300; --series-7:#6250d6;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page:#000; --surface:#1c1c1e; --ink:#f2f2f0; --ink2:#c3c2b7; --muted:#8e8e93;
    --grid:#2c2c2e; --axis:#48484a; --border:rgba(255,255,255,.12); --accent:#3987e5; --warn-bg:#3a2f0b;
    --bar:rgba(28,28,30,.82); --segsel:#636366;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --series-5:#d55181; --series-6:#0ca30c; --series-7:#9085e9;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; overflow-x:hidden; }
body { margin:0; background:var(--page); color:var(--ink); font:17px/1.35 var(--font);
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
button, input { font:inherit; color:inherit; }
button { -webkit-appearance:none; appearance:none; }
input { -webkit-user-select:text; user-select:text; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
[hidden] { display:none !important; }

/* ---- Barra superior ---- */
.bar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 20px) 10px calc(env(safe-area-inset-left) + 20px);
  background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-bottom:.5px solid var(--border); }
.bar h1 { margin:0; font-size:26px; font-weight:700; letter-spacing:-.3px; }
.bar .sub { color:var(--ink2); font-size:14px; margin-left:10px; flex:1; min-width:0; }
.icon-btn { min-width:44px; height:44px; padding:0 10px; border:none; background:transparent; color:var(--accent); border-radius:22px; display:inline-grid; place-items:center; text-decoration:none; font-size:15px; }
.icon-btn:active { background:var(--grid); }
.icon-btn svg { width:22px; height:22px; }
.icon-btn.spin svg { animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.banner { margin:12px calc(env(safe-area-inset-right) + 20px) 0 calc(env(safe-area-inset-left) + 20px); background:var(--warn-bg); border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-size:15px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.banner .t { flex:1; min-width:200px; }
.btn { min-height:44px; padding:0 18px; border-radius:12px; border:none; background:var(--accent); color:var(--on-accent); font-weight:600; text-decoration:none; display:inline-flex; align-items:center; }
.btn.sec { background:var(--grid); color:var(--ink); }
.btn.danger { background:var(--critical); color:#fff; }
.btn:active { filter:brightness(.9); }

/* ---- Vista dividida ---- */
.split { display:grid; grid-template-columns:minmax(300px,360px) minmax(0,1fr); gap:20px; align-items:start;
  padding:16px calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 20px); }
.side { position:sticky; top:calc(env(safe-area-inset-top) + 74px); max-height:calc(100dvh - env(safe-area-inset-top) - 90px); overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px; margin:-2px; }
@media (max-width: 760px) {  /* Split View estrecho / Slide Over: una sola columna */
  .split { grid-template-columns:minmax(0,1fr); gap:12px; }
  .side { position:static; max-height:none; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
}
.card { background:var(--surface); border-radius:16px; padding:12px 14px; margin-bottom:10px; border:2px solid transparent; }
@media (max-width: 760px) { .card { margin-bottom:0; } }
.card[aria-current="true"] { border-color:var(--accent); }
.card.tap:active { filter:brightness(.96); }
.c-top { display:flex; align-items:center; gap:10px; }
.key { width:6px; align-self:stretch; border-radius:3px; flex:none; min-height:22px; }
.c-top h2 { margin:0; font-size:17px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tag { font-size:11px; font-weight:600; color:var(--ink2); background:var(--grid); border-radius:6px; padding:1px 6px; }
.pill { font-size:13px; color:var(--ink2); display:inline-flex; align-items:center; gap:5px; }
.dot { width:9px; height:9px; border-radius:50%; background:var(--good); display:inline-block; }
.dot.off { background:transparent; border:2px solid var(--critical); }
.c-main { display:flex; align-items:center; justify-content:space-between; margin-top:4px; }
.power { font-size:34px; font-weight:700; letter-spacing:-.8px; line-height:1.15; font-variant-numeric:tabular-nums; }
.power small { font-size:16px; font-weight:500; color:var(--ink2); margin-left:3px; letter-spacing:0; }
.meta { display:flex; gap:12px; color:var(--ink2); font-size:14px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
.meta b { color:var(--ink); font-weight:600; }
.err { color:var(--ink2); font-size:13px; margin-top:6px; }
.err:empty { display:none; }
.empty { text-align:center; color:var(--ink2); padding:30px 12px; }

/* Interruptor al estilo iOS: el borde transparente de 7 px amplía el área táctil (≥ 44 pt) */
.switch { box-sizing:content-box; width:51px; height:31px; border:7px solid transparent; background-clip:padding-box; margin:-7px; border-radius:23px;
  background-color:var(--axis); position:relative; padding:0; flex:none; transition:background-color .2s; }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.25); transition:left .2s; }
.switch[aria-checked="true"] { background-color:var(--good); }
.switch[aria-checked="true"]::after { left:22px; }
.switch:disabled { opacity:.4; }

/* ---- Detalle ---- */
.detail { min-width:0; }
.detail h2.sel { margin:0 0 10px; font-size:24px; font-weight:700; letter-spacing:-.3px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
.tile { background:var(--surface); border-radius:14px; padding:10px 14px; }
.tile .l { color:var(--ink2); font-size:13px; }
.tile .v { font-size:26px; font-weight:650; font-variant-numeric:tabular-nums; }
.tile .v small { font-size:14px; color:var(--ink2); font-weight:500; }
.controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
.seg { display:inline-grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--grid); border-radius:10px; padding:2px; }
.seg button { min-height:40px; min-width:64px; padding:0 14px; border:none; background:transparent; border-radius:8px; font-size:15px; }
.seg button[aria-pressed="true"] { background:var(--segsel); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.18); }
.legend { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.chip { min-height:38px; padding:0 14px; border-radius:19px; border:none; background:var(--surface); color:var(--ink); font-size:15px; display:inline-flex; align-items:center; gap:6px; }
.chip[aria-pressed="false"] { opacity:.45; text-decoration:line-through; }
.chip .k { width:14px; height:0; border-top:3px solid; border-radius:2px; }

.chartbox { position:relative; background:var(--surface); border-radius:16px; padding:10px 6px 4px; }
.chartbox svg { width:100%; display:block; touch-action:pan-y; -webkit-user-select:none; user-select:none; }
.c-grid { stroke:var(--grid); stroke-width:1; }
.c-axis { fill:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
.c-muted { fill:var(--muted); font-size:15px; }
.c-cross { stroke:var(--axis); stroke-width:1; }
.c-dot { stroke:var(--surface); stroke-width:2; }
.tip { position:absolute; top:8px; z-index:3; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:6px 10px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.18); pointer-events:none; max-width:60%; }
.tip-row { display:flex; align-items:center; gap:6px; white-space:nowrap; }
.tip-key { width:10px; height:3px; border-radius:2px; flex:none; }
.tip-name { flex:1; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; }
.tip-val { font-weight:600; font-variant-numeric:tabular-nums; margin-left:8px; }
.hint { color:var(--muted); font-size:13px; margin:8px 0 0; }

h3.sec { font-size:20px; margin:22px 0 8px; font-weight:650; }
.tbl { background:var(--surface); border-radius:16px; overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:15px; font-variant-numeric:tabular-nums; }
th, td { padding:11px 14px; text-align:right; white-space:nowrap; border-bottom:.5px solid var(--border); }
th:first-child, td:first-child { text-align:left; }
th { color:var(--ink2); font-weight:500; font-size:13px; }
tr:last-child td { border-bottom:none; }
tbody tr { cursor:pointer; }
tbody tr[aria-current="true"] td { background:color-mix(in srgb, var(--accent) 10%, transparent); }
td a { color:var(--accent); text-decoration:none; padding:10px 0; display:inline-block; }
.k2 { display:inline-block; width:12px; height:0; border-top:3px solid; border-radius:2px; margin-right:8px; vertical-align:middle; }
footer { color:var(--muted); font-size:13px; text-align:center; margin:26px 0 0; line-height:1.5; }

/* ---- Ajustes (ventana modal), hoja de confirmación y aviso ---- */
dialog { border:none; border-radius:20px; padding:0; width:min(560px, calc(100vw - 32px)); max-height:calc(100dvh - 48px); background:var(--page); color:var(--ink); }
dialog::backdrop { background:rgba(0,0,0,.4); }
.dlg-h { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 4px 20px; }
.dlg-h h2 { margin:0; font-size:20px; }
.dlg-b { padding:0 16px 16px; }
.gtitle { color:var(--ink2); font-size:13px; text-transform:uppercase; letter-spacing:.4px; margin:14px 4px 6px; }
.group { background:var(--surface); border-radius:14px; padding:4px 16px; }
.row { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:50px; border-bottom:.5px solid var(--border); }
.row:last-child { border-bottom:none; }
.row .l { flex:1; }
.row .d { color:var(--ink2); font-size:13px; }
.field { width:100%; min-height:44px; border-radius:10px; border:1px solid var(--border); background:var(--page); padding:0 12px; font-size:16px; margin:8px 0; }
.group a { color:var(--accent); text-decoration:none; }
.sheet-bg { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.4); }
.sheet { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(360px, calc(100vw - 32px)); z-index:41; background:var(--surface); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:8px; }
.sheet h3 { margin:0; font-size:17px; text-align:center; }
.sheet p { margin:0 0 6px; color:var(--ink2); font-size:14px; text-align:center; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 20px); z-index:45; background:#2c2c2e; color:#fff; border-radius:14px; padding:12px 18px; font-size:15px; max-width:calc(100vw - 32px); }
</style>
</head>
<body>
<header class="bar">
  <h1>Enchufes</h1><div class="sub" id="sub">Conectando…</div>
  <button class="icon-btn" id="btnRefresh" aria-label="Actualizar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
  <button class="icon-btn" id="btnAjustes" aria-label="Ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>

<div class="banner" id="banner" hidden></div>

<script>
/* =====================================================================
   Núcleo común: utilidades, cliente de la API de TeleHome Enchufes,
   estado de la aplicación y gráfica SVG (sin librerías externas).
   ===================================================================== */
"use strict";

/* ---------- utilidades ---------- */
const NS = "http://www.w3.org/2000/svg";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

// Crea un elemento HTML: attrs admite class, text, on<evento> y atributos normales.
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "text") e.textContent = v;
    else if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
// Crea un elemento SVG.
const sv = (tag, attrs = {}, text) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
};
const fmt = (v, d = 1) =>
  v == null || Number.isNaN(+v) ? "—" : Number(v).toLocaleString("es-ES", { minimumFractionDigits: d, maximumFractionDigits: d });
const pad2 = (n) => String(n).padStart(2, "0");
function tlabel(t, withDate) {
  const d = new Date(t * 1000), hm = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  return withDate ? pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + " " + hm : hm;
}
// Preferencias del usuario en este dispositivo (localStorage puede no estar disponible).
const prefs = {
  get(k, def) { try { const v = localStorage.getItem("telehome." + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem("telehome." + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
};

/* ---------- constantes ---------- */
const RANGES = [["1 h", 3600], ["6 h", 21600], ["24 h", 86400], ["7 d", 604800], ["30 d", 2592000]];
const METRICS = {
  p: { label: "Potencia", unit: "W", dec: 1, zero: true },
  v: { label: "Tensión", unit: "V", dec: 1, zero: false },
  i: { label: "Corriente", unit: "A", dec: 3, zero: true },
};
// Dónde buscar la API: 1) la URL puesta a mano en Ajustes; 2) el servicio publicado por instalar-todo
// en Apache (/rafa/telehome/enchufes/); 3) relativa (si esta página la sirve el propio servicio).
const API_CANDIDATAS = ["/rafa/telehome/enchufes/api/", "api/"];
const INTERFAZ_COMPLETA = "/rafa/telehome/enchufes/";

/* ---------- estado ---------- */
const APP = {
  base: null,            // URL base de la API detectada
  state: null,           // respuesta de /api/state
  range: prefs.get("range", 86400),
  metric: "p",
  sel: "all",            // "all" o id de enchufe
  hist: null, sum: null,
  hidden: new Set(),     // enchufes ocultos en la gráfica
  needAuth: false,       // el servicio pide contraseña
  error: "",             // último error de conexión
  busy: new Set(),       // enchufes con una orden en curso
};
let histToken = 0;       // descarta respuestas de histórico que llegan tarde

/* ---------- cliente de la API ---------- */
async function api(path, opt = {}) {
  const init = { method: opt.method || "GET", headers: { "X-TeleHome": "1" }, cache: "no-store" };
  if (opt.body !== undefined) { init.body = JSON.stringify(opt.body); init.headers["Content-Type"] = "application/json"; }
  const r = await fetch(APP.base + path, init);
  let data = null;
  try { data = await r.json(); } catch (e) { /* respuesta no JSON */ }
  if (!r.ok) { const err = new Error((data && data.error) || ("Error " + r.status)); err.status = r.status; throw err; }
  return data;
}
// Comprueba si hay un servicio TeleHome en `base`: "ok", "auth" (pide contraseña) o null.
async function probe(base) {
  try {
    const r = await fetch(base + "health", { headers: { "X-TeleHome": "1" }, cache: "no-store" });
    if (r.status === 401) return "auth";
    if (!r.ok) return null;
    const j = await r.json();
    return j && j.ok ? "ok" : null;
  } catch (e) { return null; }
}
async function detectApi() {
  const manual = prefs.get("api", "");
  for (const base of (manual ? [manual] : API_CANDIDATAS)) {
    const p = await probe(base);
    if (p) { APP.base = base; return p; }
  }
  APP.base = null;
  return null;
}

/* ---------- datos ---------- */
const devs = () => (APP.state ? APP.state.devices : []);
const colorOf = (d) => "var(--series-" + (((d.slot ?? 0) % 7) + 1) + ")";
const totalPower = () => devs().reduce((s, d) => s + (d.reading && d.reading.online && d.reading.power_w ? d.reading.power_w : 0), 0);
const totalToday = () => devs().reduce((s, d) => s + (d.energy_today_kwh || 0), 0);
const onlineCount = () => devs().filter((d) => d.reading && d.reading.online).length;

async function loadState() {
  if (!APP.base) { const p = await detectApi(); if (!p) { APP.error = "No encuentro el servicio TeleHome."; APP.state = null; return false; } }
  try {
    APP.state = await api("state");
    APP.error = ""; APP.needAuth = false;
    return true;
  } catch (e) {
    if (e.status === 401) { APP.needAuth = true; APP.error = "El servicio pide contraseña."; }

/* ---------- gráfica ---------- */
function niceTicks(lo, hi, n = 4) {
  if (!(hi > lo)) hi = lo + 1;
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || 10 * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}
const visibleDevs = () => devs().filter((d) => (APP.sel === "all" || APP.sel === d.id) && !APP.hidden.has(d.id));

// Dibuja la gráfica en `svg`. Guarda la geometría en svg._geo para el cursor táctil.
function drawChart(svg, tip, height) {
  const H = height, W = Math.max(svg.clientWidth, 260);
  svg.replaceChildren(); svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg._geo = null; if (tip) tip.hidden = true;
  const hist = APP.hist, m = METRICS[APP.metric], list = visibleDevs();
  const note = (msg) => svg.append(sv("text", { x: W / 2, y: H / 2, "text-anchor": "middle", class: "c-muted" }, msg));
  if (!hist) return note("Cargando…");
  const M = { l: 46, r: 10, t: 10, b: 24 }, iw = W - M.l - M.r, ih = H - M.t - M.b;
  const span = hist.to - hist.from, bucket = Math.max(1, Math.ceil(span / 300));
  let lo = Infinity, hi = -Infinity;
  const series = list.map((d) => {
    const pts = (hist.series[d.id] || []).filter((p) => p[APP.metric] != null && p.online !== 0)
      .map((p) => ({ t: p.t, y: p[APP.metric] }));
    for (const p of pts) { if (p.y < lo) lo = p.y; if (p.y > hi) hi = p.y; }
    return { dev: d, pts };
  });
  if (lo === Infinity) return note("Sin datos en este intervalo");
  if (m.zero) lo = Math.min(0, lo);
  else { const pad = (hi - lo || 1) * 0.15; lo -= pad; hi += pad; }
  if (hi === lo) hi = lo + 1;
  const ticks = niceTicks(lo, hi); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const X = (t) => M.l + ((t - hist.from) / span) * iw, Y = (v) => M.t + ih - ((v - lo) / (hi - lo)) * ih;
  for (const v of ticks) {
    svg.append(sv("line", { x1: M.l, x2: W - M.r, y1: Y(v), y2: Y(v), class: "c-grid" }));
    svg.append(sv("text", { x: M.l - 6, y: Y(v) + 4, "text-anchor": "end", class: "c-axis" }, fmt(v, v % 1 ? 1 : 0)));
  }
  const withDate = span > 86400, nx = iw > 520 ? 6 : 4;
  for (let k = 0; k <= nx; k++) {
    const t = hist.from + (span * k) / nx;
    svg.append(sv("text", { x: X(t), y: H - 6, "text-anchor": k === 0 ? "start" : k === nx ? "end" : "middle", class: "c-axis" }, tlabel(t, withDate)));
  }
  for (const s of series) {
    let dpath = "", prev = null;
    for (const p of s.pts) {
      const gap = prev === null || p.t - prev > bucket * 3;
      dpath += (gap ? "M" : "L") + X(p.t).toFixed(1) + " " + Y(p.y).toFixed(1);
      prev = p.t;
    }
    if (s.pts.length === 1) { const p = s.pts[0]; dpath = "M" + (X(p.t) - 1) + " " + Y(p.y) + "L" + (X(p.t) + 1) + " " + Y(p.y); }
    svg.append(sv("path", { d: dpath, fill: "none", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", style: "stroke:" + colorOf(s.dev) }));
  }
  svg.append(sv("line", { class: "c-cross", y1: M.t, y2: M.t + ih, x1: 0, x2: 0, visibility: "hidden" }));
  for (const s of series) svg.append(sv("circle", { class: "c-dot", r: 4.5, cx: 0, cy: 0, visibility: "hidden", style: "fill:" + colorOf(s.dev) }));
  svg._geo = { M, iw, ih, W, H, X, Y, hist, series, m, tip };
}

// Cursor táctil / ratón: línea vertical + valores de cada enchufe en el instante más cercano.
function hoverChart(svg, ev) {
  const g = svg._geo; if (!g) return;
  const rect = svg.getBoundingClientRect(), px = ((ev.clientX - rect.left) / rect.width) * g.W;
  const t = g.hist.from + ((px - g.M.l) / g.iw) * (g.hist.to - g.hist.from);
  const near = (pts) => { // punto más cercano a t (búsqueda binaria)
    let a = 0, b = pts.length - 1; if (b < 0) return null;
    while (b - a > 1) { const c = (a + b) >> 1; if (pts[c].t < t) a = c; else b = c; }
    return Math.abs(pts[a].t - t) <= Math.abs(pts[b].t - t) ? pts[a] : pts[b];
  };
  const rows = [];
  g.series.forEach((s, k) => { const p = near(s.pts); if (p) rows.push({ s, p, k }); });
  if (!rows.length) return;
  const t0 = rows[0].p.t, x = g.X(t0);
  const cross = $(".c-cross", svg); cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
  const dots = $$(".c-dot", svg);
  dots.forEach((c) => c.setAttribute("visibility", "hidden"));

    ...rows.map((r) => el("div", { class: "tip-row" }, el("span", { class: "tip-key", style: "background:" + colorOf(r.s.dev) }),
      el("span", { class: "tip-name", text: r.s.dev.name }), el("span", { class: "tip-val", text: fmt(r.p.y, g.m.dec) + " " + g.m.unit }))));
  tip.hidden = false;
  const wrap = svg.parentElement.getBoundingClientRect(), sx = (x / g.W) * rect.width + (rect.left - wrap.left);
  const w = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(sx + 12, wrap.width - w)) + "px";
}
function clearHover(svg) {
  if (!svg._geo) return;
  $(".c-cross", svg).setAttribute("visibility", "hidden");
  $$(".c-dot", svg).forEach((c) => c.setAttribute("visibility", "hidden"));

function bindChart(svg) {
  svg.addEventListener("pointerdown", (e) => hoverChart(svg, e));

  svg.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") clearHover(svg); });

// Refresca el estado cada getSeg() segundos mientras la página está visible.
function startPolling(onTick, getSeg = () => 5) {

        el("div", { style: "padding:6px 0" }, el("div", { class: "l", text: "Actualizar cada" }), seg)),
      el("div", { class: "gtitle", text: "Más" }),
      el("div", { class: "group" }, el("div", { class: "row" }, el("a", { class: "l", href: INTERFAZ_COMPLETA, target: "_blank", rel: "noopener", text: "Abrir la interfaz completa" }),
        el("span", { class: "d", text: "Añadir, editar y modo nube" })))));
  if (!dlg.open) dlg.showModal();
}

/* ---------- ciclo de datos ---------- */
async function cargarHistorial() {
  await loadHistory(); ultimoHist = Date.now();
  pintarTiles(); pintarGrafica(); pintarTabla();
}
async function actualizar(manual) {
  const b = $("#btnRefresh"); if (manual) b.classList.add("spin");
  await loadState();
  const firma = devs().map((d) => d.id + d.name).join("|");
  if (firma !== firmaDevs) { firmaDevs = firma; pintarControles(); }   // la leyenda depende de los enchufes
  pintarBarra(); pintarBanner(); pintarLista(); pintarTiles(); pintarTabla();
  if (APP.state && (manual || !APP.hist || Date.now() - ultimoHist > 30000)) await cargarHistorial();
  b.classList.remove("spin");
}

$("#pie").append("TeleHome Enchufes · iPad " + VERSION, el("br"), "Rafa · Dpto. de Ingeniería de Sistemas y Automática · UMH", el("br"),
  "Generado con IA · Revisado por el autor", el("br"), "Última modificación: " + MODIFICADO);
bindChart($("#chart"));
$("#btnRefresh").addEventListener("click", () => actualizar(true));
$("#btnAjustes").addEventListener("click", abrirAjustes);
let anchoPrevio = innerWidth;
addEventListener("resize", () => { if (innerWidth !== anchoPrevio) { anchoPrevio = innerWidth; pintarGrafica(); } });
pintarDetalle();
const poll = startPolling(() => actualizar(false), () => refrescoSeg);
