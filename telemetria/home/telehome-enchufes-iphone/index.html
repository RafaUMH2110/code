<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeleHome Enchufes · iPhone</title>
<meta name="description" content="TeleHome Enchufes para iPhone: consulta el consumo de tus enchufes Wi-Fi y enciéndelos o apágalos.">
<!-- Pantalla de inicio de iOS: «Compartir → Añadir a pantalla de inicio» la abre como una app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TeleHome">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M17 5 9 18h6l-1 9 9-14h-6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ---- Colores: paleta de series validada (claro/oscuro) y superficies estilo iOS ---- */
:root {
  color-scheme: light dark;
  --page:#f2f2f0; --surface:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e6e5df; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --accent:#2a78d6; --on-accent:#fff;
  --good:#0ca30c; --critical:#d03b3b; --warn-bg:#fff4d6; --bar:rgba(249,249,247,.82); --segsel:#fff;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --series-5:#e87ba4; --series-6:#008300; --series-7:#6250d6;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page:#000; --surface:#1c1c1e; --ink:#f2f2f0; --ink2:#c3c2b7; --muted:#8e8e93;
    --grid:#2c2c2e; --axis:#48484a; --border:rgba(255,255,255,.12); --accent:#3987e5; --warn-bg:#3a2f0b;
    --bar:rgba(28,28,30,.82); --segsel:#636366;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --series-5:#d55181; --series-6:#0ca30c; --series-7:#9085e9;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--page); color:var(--ink); font:17px/1.35 var(--font);
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:contain; -webkit-user-select:none; user-select:none; }
button, input { font:inherit; color:inherit; }
button { -webkit-appearance:none; appearance:none; }
input { -webkit-user-select:text; user-select:text; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
[hidden] { display:none !important; }

/* ---- Cabecera ---- */
.top { position:sticky; top:0; z-index:10; padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;
  background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  display:flex; align-items:flex-end; gap:10px; border-bottom:.5px solid var(--border); }
.top .tt { flex:1; min-width:0; }
.top h1 { margin:0; font-size:30px; line-height:1.1; font-weight:700; letter-spacing:-.4px; }
.top .sub { color:var(--ink2); font-size:14px; margin-top:2px; }
.icon-btn { width:44px; height:44px; border:none; background:transparent; color:var(--accent); border-radius:22px; display:grid; place-items:center; }
.icon-btn:active { background:var(--grid); }
.icon-btn svg { width:22px; height:22px; }
.icon-btn.spin svg { animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ---- Contenido ---- */
main { padding:12px 16px calc(49px + env(safe-area-inset-bottom) + 28px); }
.banner { margin:10px 16px 0; background:var(--warn-bg); border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-size:15px; }
.banner .acts { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.btn { min-height:44px; padding:0 18px; border-radius:12px; border:none; background:var(--accent); color:var(--on-accent); font-weight:600; }
.btn.sec { background:var(--grid); color:var(--ink); }
.btn.danger { background:var(--critical); color:#fff; }
.btn:active { filter:brightness(.9); }
.empty { text-align:center; color:var(--ink2); padding:40px 16px; }

.card { background:var(--surface); border-radius:16px; padding:14px 16px; margin-bottom:12px; }
.card.tap:active { filter:brightness(.96); }
.c-top { display:flex; align-items:center; gap:10px; }
.key { width:6px; align-self:stretch; border-radius:3px; flex:none; min-height:22px; }
.c-top h2 { margin:0; font-size:17px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tag { font-size:11px; font-weight:600; color:var(--ink2); background:var(--grid); border-radius:6px; padding:1px 6px; }
.pill { font-size:13px; color:var(--ink2); display:inline-flex; align-items:center; gap:5px; }
.dot { width:9px; height:9px; border-radius:50%; background:var(--good); display:inline-block; }
.dot.off { background:transparent; border:2px solid var(--critical); }
.c-main { display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
.power { font-size:40px; font-weight:700; letter-spacing:-1px; line-height:1.1; font-variant-numeric:tabular-nums; }
.power small { font-size:17px; font-weight:500; color:var(--ink2); margin-left:3px; letter-spacing:0; }
.meta { display:flex; gap:14px; color:var(--ink2); font-size:14px; flex-wrap:wrap; margin-top:2px; font-variant-numeric:tabular-nums; }
.meta b { color:var(--ink); font-weight:600; }
.err { color:var(--ink2); font-size:13px; margin-top:6px; }
.err:empty { display:none; }

/* Interruptor al estilo iOS (51×31) */
.switch { width:51px; height:31px; border-radius:16px; border:none; background:var(--axis); position:relative; padding:0; flex:none; transition:background .2s; }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.25); transition:left .2s; }
.switch[aria-checked="true"] { background:var(--good); }
.switch[aria-checked="true"]::after { left:22px; }
.switch:disabled { opacity:.4; }
/* El área táctil del interruptor es mayor que su dibujo (mínimo recomendado: 44 pt):
   el borde transparente de 7 px amplía el botón sin cambiar el aspecto */
.switch { box-sizing:content-box; width:51px; height:31px; border:7px solid transparent; background-clip:padding-box; margin:-7px; border-radius:23px; }

/* ---- Selectores ---- */
.scroller { display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
.scroller::-webkit-scrollbar { display:none; }
.chip { flex:none; min-height:38px; padding:0 14px; border-radius:19px; border:none; background:var(--surface); color:var(--ink); font-size:15px; display:inline-flex; align-items:center; gap:6px; }
.chip[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); font-weight:600; }
.chip .k { width:14px; height:0; border-top:3px solid; border-radius:2px; }
.seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--grid); border-radius:10px; padding:2px; margin-bottom:12px; }
.seg button { min-height:36px; border:none; background:transparent; border-radius:8px; font-size:14px; }
.seg button[aria-pressed="true"] { background:var(--segsel); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.18); }
.stats { display:flex; gap:12px; margin-bottom:8px; }
.stat { flex:1; background:var(--surface); border-radius:14px; padding:10px 12px; }
.stat .l { color:var(--ink2); font-size:13px; }
.stat .v { font-size:22px; font-weight:650; font-variant-numeric:tabular-nums; }
.stat .v small { font-size:13px; color:var(--ink2); font-weight:500; }

/* ---- Gráfica ---- */
.chartbox { position:relative; background:var(--surface); border-radius:16px; padding:8px 4px 4px; }
.chartbox svg { width:100%; display:block; touch-action:pan-y; -webkit-user-select:none; user-select:none; }
.c-grid { stroke:var(--grid); stroke-width:1; }
.c-axis { fill:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
.c-muted { fill:var(--muted); font-size:15px; }
.c-cross { stroke:var(--axis); stroke-width:1; }
.c-dot { stroke:var(--surface); stroke-width:2; }
.tip { position:absolute; top:6px; z-index:3; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:6px 10px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.18); pointer-events:none; max-width:70%; }
.tip-row { display:flex; align-items:center; gap:6px; white-space:nowrap; }
.tip-key { width:10px; height:3px; border-radius:2px; flex:none; }
.tip-name { flex:1; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; }
.tip-val { font-weight:600; font-variant-numeric:tabular-nums; margin-left:8px; }
.hint { color:var(--muted); font-size:13px; text-align:center; margin:8px 0 0; }

/* ---- Resumen ---- */
.s-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; margin-top:8px; }
.s-grid .l { color:var(--ink2); font-size:13px; }
.s-grid .v { font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; }
.s-foot { margin-top:10px; font-size:15px; }
.s-foot a { color:var(--accent); text-decoration:none; }

/* ---- Ajustes ---- */
.group { background:var(--surface); border-radius:16px; padding:4px 16px; margin-bottom:16px; }
.row { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:50px; border-bottom:.5px solid var(--border); }
.row:last-child { border-bottom:none; }
.row .l { flex:1; }
.row .d { color:var(--ink2); font-size:13px; }
.field { width:100%; min-height:44px; border-radius:10px; border:1px solid var(--border); background:var(--page); padding:0 12px; font-size:16px; margin:8px 0; }
.gtitle { color:var(--ink2); font-size:13px; text-transform:uppercase; letter-spacing:.4px; margin:18px 16px 6px; }
.group a { color:var(--accent); text-decoration:none; }
footer { color:var(--muted); font-size:13px; text-align:center; margin:18px 0 0; line-height:1.5; }

/* ---- Barra de pestañas ---- */
.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom); background:var(--bar); border-top:.5px solid var(--border);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); }
.tab { min-height:49px; border:none; background:transparent; color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:10px; padding:4px 0; }
.tab svg { width:25px; height:25px; }
.tab[aria-selected="true"] { color:var(--accent); }

/* ---- Hoja inferior y aviso ---- */
.sheet-bg { position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.4); }
.sheet { position:fixed; left:8px; right:8px; bottom:calc(env(safe-area-inset-bottom) + 8px); z-index:31; background:var(--surface); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:8px; }
.sheet h3 { margin:0; font-size:17px; text-align:center; }
.sheet p { margin:0 0 6px; color:var(--ink2); font-size:14px; text-align:center; }
.toast { position:fixed; left:16px; right:16px; bottom:calc(49px + env(safe-area-inset-bottom) + 12px); z-index:25; background:#2c2c2e; color:#fff; border-radius:14px; padding:12px 16px; font-size:15px; text-align:center; }
</style>
</head>
<body>
<header class="top">
  <div class="tt"><h1 id="title">Enchufes</h1><div class="sub" id="sub">Conectando…</div></div>
  <button class="icon-btn" id="btnRefresh" aria-label="Actualizar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
</header>
<div class="banner" id="banner" hidden></div>
<main id="view"></main>
<nav class="tabbar" role="tablist" aria-label="Secciones" id="tabbar"></nav>
<div class="toast" id="toast" hidden role="status"></div>
<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

<script>
/* =====================================================================
   Núcleo común: utilidades, cliente de la API de TeleHome Enchufes,
   estado de la aplicación y gráfica SVG (sin librerías externas).
   ===================================================================== */
"use strict";

/* ---------- utilidades ---------- */
const NS = "http://www.w3.org/2000/svg";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

// Crea un elemento HTML: attrs admite class, text, on<evento> y atributos normales.
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "text") e.textContent = v;
    else if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
// Crea un elemento SVG.
const sv = (tag, attrs = {}, text) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
};
const fmt = (v, d = 1) =>
  v == null || Number.isNaN(+v) ? "—" : Number(v).toLocaleString("es-ES", { minimumFractionDigits: d, maximumFractionDigits: d });
const pad2 = (n) => String(n).padStart(2, "0");
function tlabel(t, withDate) {
  const d = new Date(t * 1000), hm = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  return withDate ? pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + " " + hm : hm;
}
// Preferencias del usuario en este dispositivo (localStorage puede no estar disponible).
const prefs = {
  get(k, def) { try { const v = localStorage.getItem("telehome." + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem("telehome." + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
};

/* ---------- constantes ---------- */
const RANGES = [["1 h", 3600], ["6 h", 21600], ["24 h", 86400], ["7 d", 604800], ["30 d", 2592000]];
const METRICS = {
  p: { label: "Potencia", unit: "W", dec: 1, zero: true },
  v: { label: "Tensión", unit: "V", dec: 1, zero: false },
  i: { label: "Corriente", unit: "A", dec: 3, zero: true },
};
// Dónde buscar la API: 1) la URL puesta a mano en Ajustes; 2) el servicio publicado por instalar-todo
// en Apache (/rafa/telehome/enchufes/); 3) relativa (si esta página la sirve el propio servicio).
const API_CANDIDATAS = ["/rafa/telehome/enchufes/api/", "api/"];
const INTERFAZ_COMPLETA = "/rafa/telehome/enchufes/";

/* ---------- estado ---------- */
const APP = {
  base: null,            // URL base de la API detectada
  state: null,           // respuesta de /api/state
  range: prefs.get("range", 86400),
  metric: "p",
  sel: "all",            // "all" o id de enchufe
  hist: null, sum: null,
  hidden: new Set(),     // enchufes ocultos en la gráfica
  needAuth: false,       // el servicio pide contraseña
  error: "",             // último error de conexión
  busy: new Set(),       // enchufes con una orden en curso
};
let histToken = 0;       // descarta respuestas de histórico que llegan tarde

/* ---------- cliente de la API ---------- */
async function api(path, opt = {}) {
  const init = { method: opt.method || "GET", headers: { "X-TeleHome": "1" }, cache: "no-store" };
  if (opt.body !== undefined) { init.body = JSON.stringify(opt.body); init.headers["Content-Type"] = "application/json"; }
  const r = await fetch(APP.base + path, init);
  let data = null;
  try { data = await r.json(); } catch (e) { /* respuesta no JSON */ }
  if (!r.ok) { const err = new Error((data && data.error) || ("Error " + r.status)); err.status = r.status; throw err; }
  return data;
}
// Comprueba si hay un servicio TeleHome en `base`: "ok", "auth" (pide contraseña) o null.
async function probe(base) {
  try {
    const r = await fetch(base + "health", { headers: { "X-TeleHome": "1" }, cache: "no-store" });
    if (r.status === 401) return "auth";
    if (!r.ok) return null;
    const j = await r.json();
    return j && j.ok ? "ok" : null;
  } catch (e) { return null; }
}
async function detectApi() {
  const manual = prefs.get("api", "");
  for (const base of (manual ? [manual] : API_CANDIDATAS)) {
    const p = await probe(base);
    if (p) { APP.base = base; return p; }
  }
  APP.base = null;
  return null;
}

/* ---------- datos ---------- */
const devs = () => (APP.state ? APP.state.devices : []);
const colorOf = (d) => "var(--series-" + (((d.slot ?? 0) % 7) + 1) + ")";
const totalPower = () => devs().reduce((s, d) => s + (d.reading && d.reading.online && d.reading.power_w ? d.reading.power_w : 0), 0);
const totalToday = () => devs().reduce((s, d) => s + (d.energy_today_kwh || 0), 0);
const onlineCount = () => devs().filter((d) => d.reading && d.reading.online).length;

async function loadState() {
  if (!APP.base) { const p = await detectApi(); if (!p) { APP.error = "No encuentro el servicio TeleHome."; APP.state = null; return false; } }
  try {
    APP.state = await api("state");
    APP.error = ""; APP.needAuth = false;
    return true;
  } catch (e) {
    if (e.status === 401) { APP.needAuth = true; APP.error = "El servicio pide contraseña."; }
    else APP.error = e.message === "Failed to fetch" || e.name === "TypeError" ? "Sin conexión con el servicio." : e.message;
    if (e.status !== 401) APP.base = null; // volverá a buscarlo en el siguiente intento
    return false;
  }
}
async function loadHistory() {
  if (!APP.base || !APP.state) return;
  const tk = ++histToken;
  try {
    const [h, s] = await Promise.all([
      api("history?plug=" + encodeURIComponent(APP.sel) + "&range=" + APP.range + "&points=300"),
      api("summary?range=" + APP.range),
    ]);
    if (tk === histToken) { APP.hist = h; APP.sum = s; }
  } catch (e) { if (tk === histToken) { APP.hist = null; APP.sum = null; } }
}
// Enciende o apaga. Devuelve el mensaje de error (o "" si fue bien).
async function setPower(dev, on) {
  APP.busy.add(dev.id);
  try { await api("plugs/" + dev.id + "/power", { method: "POST", body: { on } }); return ""; }
  catch (e) { return e.message; }
  finally { APP.busy.delete(dev.id); }
}
function csvUrl(id) { return APP.base + "export.csv?plug=" + encodeURIComponent(id) + "&range=" + APP.range; }

/* ---------- gráfica ---------- */
function niceTicks(lo, hi, n = 4) {
  if (!(hi > lo)) hi = lo + 1;
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || 10 * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}
const visibleDevs = () => devs().filter((d) => (APP.sel === "all" || APP.sel === d.id) && !APP.hidden.has(d.id));

// Dibuja la gráfica en `svg`. Guarda la geometría en svg._geo para el cursor táctil.
function drawChart(svg, tip, height) {
  const H = height, W = Math.max(svg.clientWidth, 260);
  svg.replaceChildren(); svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg._geo = null; if (tip) tip.hidden = true;
  const hist = APP.hist, m = METRICS[APP.metric], list = visibleDevs();
  const note = (msg) => svg.append(sv("text", { x: W / 2, y: H / 2, "text-anchor": "middle", class: "c-muted" }, msg));
  if (!hist) return note("Cargando…");
  const M = { l: 46, r: 10, t: 10, b: 24 }, iw = W - M.l - M.r, ih = H - M.t - M.b;
  const span = hist.to - hist.from, bucket = Math.max(1, Math.ceil(span / 300));
  let lo = Infinity, hi = -Infinity;
  const series = list.map((d) => {
    const pts = (hist.series[d.id] || []).filter((p) => p[APP.metric] != null && p.online !== 0)
      .map((p) => ({ t: p.t, y: p[APP.metric] }));
    for (const p of pts) { if (p.y < lo) lo = p.y; if (p.y > hi) hi = p.y; }
    return { dev: d, pts };
  });
  if (lo === Infinity) return note("Sin datos en este intervalo");
  if (m.zero) lo = Math.min(0, lo);
  else { const pad = (hi - lo || 1) * 0.15; lo -= pad; hi += pad; }
  if (hi === lo) hi = lo + 1;
  const ticks = niceTicks(lo, hi); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const X = (t) => M.l + ((t - hist.from) / span) * iw, Y = (v) => M.t + ih - ((v - lo) / (hi - lo)) * ih;
  for (const v of ticks) {
    svg.append(sv("line", { x1: M.l, x2: W - M.r, y1: Y(v), y2: Y(v), class: "c-grid" }));

function hoverChart(svg, ev) {

  const t = g.hist.from + ((px - g.M.l) / g.iw) * (g.hist.to - g.hist.from);

      el("span", { class: "tip-name", text: r.s.dev.name }), el("span", { class: "tip-val", text: fmt(r.p.y, g.m.dec) + " " + g.m.unit }))));

  const stop = () => { clearTimeout(timer); timer = null; };
