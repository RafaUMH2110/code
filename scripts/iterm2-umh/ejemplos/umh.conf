# ---------- UMH ----------
# Servidor de trabajo
Host servidor
    HostName        servidor.example.es
    User            usuario
    IdentityFile    ~/.ssh/id_ed25519_umh
    IdentitiesOnly  yes
# Abre la sesión en la raíz web
Host servidor-web
    HostName        servidor.example.es
    User            usuario
    IdentityFile    ~/.ssh/id_ed25519_umh
    IdentitiesOnly  yes
    RequestTTY      yes
    RemoteCommand   cd /var/www/htdocs && exec $SHELL -l

# ---------- LAB ----------
# La misma máquina por cable...
Host equipo-lan
    HostName        192.0.2.10
    User            usuario
    IdentityFile    ~/.ssh/id_ed25519_lab
    IdentitiesOnly  yes
    HostKeyAlias    equipo
    CheckHostIP     no
# ...y por WiFi: comparten alias_host y una sola huella
Host equipo-wifi
    HostName        192.0.2.11
    User            usuario
    IdentityFile    ~/.ssh/id_ed25519_lab
    IdentitiesOnly  yes
    HostKeyAlias    equipo
    CheckHostIP     no
# Arranque dual en la misma IP: alias propio porque sus claves de host son otras
Host equipo-otro-sistema
    HostName        192.0.2.10
    User            otro
    IdentityFile    ~/.ssh/id_ed25519_lab
    IdentitiesOnly  yes
    HostKeyAlias    equipo-otro-sistema
    CheckHostIP     no

# =====================================================================
#  PLANTILLA · copia este bloque, quítale las almohadillas y edítalo
#  para añadir un servidor a mano. Lo normal es añadirlo a la hoja de
#  cálculo y volver a ejecutar generar_perfiles.py (este archivo se
#  regenera completo, así que lo que escribas aquí se perderá: para algo
#  permanente, usa otro archivo en ~/.ssh/config.d/).
# ---------------------------------------------------------------------
# Host nombre-corto
#     HostName        servidor.example.es
#     User            usuario
#     Port            22
#     IdentityFile    ~/.ssh/id_ed25519_umh
#     IdentitiesOnly  yes
#     HostKeyAlias    nombre-de-la-maquina    # si llega por varias IP
#     CheckHostIP     no                      # acompaña a HostKeyAlias
#     ProxyJump       otro-host               # si hay que saltar
#     RequestTTY      yes                     # si usas RemoteCommand
#     RemoteCommand   cd /ruta && exec $SHELL -l
# =====================================================================


# ---------------------------------------------------------------------
#  Opciones comunes. Van al final: SSH se queda con el PRIMER valor que
#  encuentra para cada opción, así que lo de cada Host de arriba manda.
# ---------------------------------------------------------------------
Host *
    AddKeysToAgent          yes
    UseKeychain             yes
    PreferredAuthentications publickey,keyboard-interactive,password
    ServerAliveInterval     60
    ServerAliveCountMax     3
    TCPKeepAlive            yes
    Compression             yes
    ControlMaster           auto
    ControlPath             ~/.ssh/cm/%r@%h:%p
    ControlPersist          10m
    HashKnownHosts          yes
