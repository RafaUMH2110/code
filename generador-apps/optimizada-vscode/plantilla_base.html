<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nombre de la app</title>
<style>
  :root {
    --color-fondo: #f5f6fa;
    --color-superficie: #ffffff;
    --color-primario: #2d3e8c;
    --color-primario-hover: #23316e;
    --color-texto: #1f2430;
    --color-texto-suave: #666b78;
    --color-borde: #e1e4ea;
    --radio: 10px;
    --sombra: 0 2px 10px rgba(0, 0, 0, 0.06);
    font-size: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --color-fondo: #16181d;
      --color-superficie: #1f2228;
      --color-texto: #e8eaed;
      --color-texto-suave: #a0a6b0;
      --color-borde: #2f333b;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--color-fondo);
    color: var(--color-texto);
    line-height: 1.5;
  }

  header {
    background: var(--color-superficie);
    border-bottom: 1px solid var(--color-borde);
    padding: 1.25rem 1.5rem;
  }

  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: .25rem 0 0; color: var(--color-texto-suave); font-size: .95rem; }

  main { max-width: 860px; margin: 0 auto; padding: 1.5rem; }

  .card {
    background: var(--color-superficie);
    border: 1px solid var(--color-borde);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }

  label { display: block; font-weight: 600; margin-bottom: .4rem; font-size: .9rem; }

  input, select, textarea {
    width: 100%;
    padding: .6rem .75rem;
    border: 1px solid var(--color-borde);
    border-radius: 8px;
    font: inherit;
    font-size: .95rem;
    background: var(--color-superficie);
    color: var(--color-texto);
    margin-bottom: 1rem;
  }

  button {
    background: var(--color-primario);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: .65rem 1.3rem;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease;
  }

  button:hover { background: var(--color-primario-hover); }
  :focus-visible { outline: 2px solid var(--color-primario); outline-offset: 2px; }

  footer {
    max-width: 860px;
    margin: 2rem auto 1.5rem;
    padding: 0 1.5rem;
    color: var(--color-texto-suave);
    font-size: .8rem;
    text-align: center;
  }

  footer p { margin: .2rem 0; }

  @media (max-width: 600px) {
    main, footer { padding-left: 1rem; padding-right: 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Nombre de la app</h1>
  <p>Breve descripción de una línea de lo que hace la app.</p>
</header>

<main>
  <div class="card">
    <!-- Contenido principal de la app -->
  </div>
</main>

<footer>
  <p>Rafael Puerto · Departamento de Ingeniería de Sistemas y Automática, UMH · r.puerto@umh.es</p>
  <p>Última modificación: FECHA_HORA</p>
  <p><em>Generado con IA · Revisado por el autor</em></p>
</footer>

<script>
  // Lógica de la app
</script>

</body>
</html>
